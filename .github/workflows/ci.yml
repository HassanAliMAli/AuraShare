name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Lets a failed pipeline be re-run on demand without a new commit.
  workflow_dispatch:

jobs:
  quality:
    name: Lint + Typecheck + Build + Test + Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      # Same suite as `npm run test`, plus the coverage thresholds enforced in
      # vitest.config.ts. A drop below the threshold fails the job.
      - name: Test
        run: npm run test:coverage

      # Fails the job on a high or critical advisory. Moderate ones are
      # reported but do not block.
      - name: Audit
        run: npm audit --audit-level=high

      - name: Upload coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # The Worker refuses to start when the assets directory is missing, and
      # `assets.directory` points at ./dist — so the app must be built first.
      - name: Build
        run: npm run build

      # The suite drives the system Google Chrome (channel: 'chrome'), which the
      # ubuntu runner images already ship — no browser download needed.
      - name: Verify Chrome is available
        run: google-chrome --version

      # Playwright starts the Vite dev server (:5173) and the Wrangler worker
      # (:8787, Durable Object signaling relay) itself via `webServer`.
      - name: Run E2E
        run: npm run test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
