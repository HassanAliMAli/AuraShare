name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Lets a failed pipeline be re-run on demand without a new commit.
  workflow_dispatch:

jobs:
  quality:
    name: Lint + Typecheck + Build + Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # Latest Node 22 satisfies Vite and Wrangler. package.json records
          # all supported ranges.
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      # Fails the job on a high or critical advisory. Moderate ones are
      # reported but do not block.
      - name: Audit
        run: npm audit --audit-level=high
