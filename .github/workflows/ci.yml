name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Lets a failed pipeline be re-run on demand without a new commit.
  workflow_dispatch:

jobs:
  quality:
    name: Lint + Typecheck + Build + Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # Latest Node 22 satisfies Vite and Wrangler. package.json records
          # all supported ranges.
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      # Production dependencies block the merge: these are the packages that
      # ship inside the Worker and the browser bundle.
      - name: Audit (production dependencies)
        run: npm audit --omit=dev --audit-level=high

      # The full tree carries one high advisory in picomatch@4.0.7, reachable
      # only through build tooling (Vite, tinyglobby, typescript-eslint) and
      # with no patched release yet. See docs/MAINTENANCE_PLAN.md. This step
      # keeps the advisory visible in every run without blocking merges; turn
      # it back into a blocking gate as soon as a fixed release ships.
      - name: Audit (full tree, advisory)
        continue-on-error: true
        run: npm audit --audit-level=high
