name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Weekly full-tree audit. The temporary picomatch exception stays advisory
  # on push/PR, but this run fails so the advisory cannot go quiet.
  schedule:
    - cron: '0 6 * * 1'
  # Lets a failed pipeline be re-run on demand without a new commit.
  workflow_dispatch:

# The job only reads the repository; the token cannot write anything.
permissions:
  contents: read

jobs:
  quality:
    name: Lint + Typecheck + Build + Audit
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to commit SHAs. Bump the comment and the SHA
      # together; a moving tag is a supply-chain dependency that can change
      # under the repository without a commit here.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Latest Node 22 satisfies Vite and Wrangler. package.json records
          # all supported ranges.
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      # Production dependencies block the merge: these are the packages that
      # ship inside the Worker and the browser bundle.
      - name: Audit (production dependencies)
        run: npm audit --omit=dev --audit-level=high

      # The full tree carries one high advisory in picomatch@4.0.7, reachable
      # only through build tooling (Vite, tinyglobby, typescript-eslint) and
      # with no patched release yet. See docs/MAINTENANCE_PLAN.md. On push/PR
      # this step keeps the advisory visible without blocking merges; the
      # scheduled run is allowed to fail so it raises a notification. Turn it
      # back into an unconditional blocking gate as soon as a fixed release
      # ships.
      - name: Audit (full tree)
        continue-on-error: ${{ github.event_name != 'schedule' }}
        run: npm audit --audit-level=high
