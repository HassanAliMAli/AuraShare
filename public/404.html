<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0c0c0e" />
    <title>404 — AuraShare</title>
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        background: #0c0c0e;
        color: #e8e8f0;
        font-family: 'Inter', system-ui, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        text-align: center;
      }
      .code { font-size: clamp(4rem, 20vw, 8rem); font-weight: 900; letter-spacing: -0.05em; color: #6c7cf8; }
      .msg { font-size: 0.875rem; text-transform: uppercase; letter-spacing: 0.3em; color: #50505e; margin: 1rem 0 2rem; font-weight: 700; }
      a { color: #e8e8f0; text-decoration: none; padding: 1rem 2rem; background: rgba(255,255,255,0.1); border-radius: 1rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.15em; font-size: 0.75rem; transition: transform 0.2s; }
      a:hover { transform: scale(1.05); }
    </style>
  </head>
  <body>
    <div>
      <div class="code">404</div>
      <div class="msg">Lost in the cosmos</div>
      <a href="/">Return to AuraShare</a>
    </div>
  </body>
</html>
