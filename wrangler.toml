name = "aurashare"

# This file is the project-level deployment descriptor: it binds the Worker
# (backend/) AND the SPA assets that the frontend build emits to dist/. It stays
# at the repository root because the Cloudflare Workers Builds integration runs
# `npx wrangler deploy` from the root, and wrangler only searches the working
# directory and its ancestors — it cannot discover a config inside a
# subdirectory. All server code itself lives in backend/.

main = "backend/index.ts"
compatibility_date = "2026-07-28"

# Static assets: the Vite build output served directly by the Worker platform.
# The frontend builds to <repo>/dist (frontend/vite.config.ts → build.outDir).
# SPA fallback handles deep-link routing (no _redirects needed).
[assets]
directory = "./dist"
not_found_handling = "single-page-application"

# Durable Object: one RoomDO instance per room code (real-time signaling relay).
[[durable_objects.bindings]]
name = "ROOMS"
class_name = "RoomDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RoomDO"]

# Rate limiting for the room API, keyed on the client IP.
#
# The room routes are the expensive ones: every one of them can allocate a
# Durable Object, and the free plan's daily request budget is finite — cross
# it and the Worker starts failing with errors until the budget resets.
#
# 120 requests a minute per IP is far above what one person needs (a session
# costs three: one mint and two sockets) and far below what a flood needs.
#
# The namespace id must be unique in the account. The limit is per Cloudflare
# location, so it is approximate worldwide.
[[ratelimits]]
name = "ROOM_RATE_LIMITER"
namespace_id = "7321"

  [ratelimits.simple]
  limit = 120
  period = 60

# Cloudflare Calls TURN — ephemeral credential generation.
# Create a TURN key in the dashboard (Cloudflare → Calls → Turn Applications),
# then set these two secrets. The Worker mints short-lived (24h) credentials
# per session via the Cloudflare API. If unset, falls back to STUN-only.
#
#   wrangler secret put TURN_KEY_ID
#   wrangler secret put TURN_KEY_API_TOKEN
